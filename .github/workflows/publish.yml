name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes from tag
        id: notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${TAG_NAME}")
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="幕府将军2 Mod 冲突检测器（解析 pack 内 db 表，检测同名表覆盖冲突与科技生态悬空引用）。下载下方 setup.exe 安装。"
          fi
          {
            echo "notes<<TAG_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "TAG_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本号自动从 tag 同步，无需手动改 tauri.conf.json
      - name: Sync version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: >
          node -e "const fs=require('fs');const tag=process.env.TAG_NAME.replace(/^v/,'');
          for(const p of ['./package.json','./src-tauri/tauri.conf.json']){
          const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=tag;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');}
          console.log('version synced to '+tag);"

      - name: Install frontend dependencies
        run: npm install

      # productName 已是 ASCII，直接 tauri build；本应用暂未接入自动更新器，无需签名密钥
      - name: Build installer
        shell: bash
        run: npx tauri build

      - name: Create release and upload installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VER="${TAG_NAME#v}"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "幕府将军2 Mod 冲突检测器 v$VER" --notes "$NOTES" --verify-tag
          SETUP_EXE=$(ls "src-tauri/target/release/bundle/nsis/"*-setup.exe | head -n1)
          ASSET_NAME="Shogun2ModDoctor_${VER}_x64-setup.exe"
          mkdir -p bundle-out
          cp "$SETUP_EXE" "bundle-out/$ASSET_NAME"
          echo "installer asset: $ASSET_NAME"
          gh release upload "$TAG_NAME" "bundle-out/$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber
