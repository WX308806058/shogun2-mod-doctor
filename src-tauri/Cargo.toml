[package]
name = "shogun2-mod-doctor"
version = "0.1.0"
description = "幕府将军2 Mod 冲突检测器"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
strip = true
lto = true
